<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/profile.css">
    
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
   
</head>

<body>

<header>
    <h1>Contact Us</h1>
    <button id="themeBtn" class="theme-btn">
        🌙 Dark Mode
        </button>
</header>

<nav>
    <a href="login.html">Home</a>
    <a href="studentdashboard.html">Dashboard</a>
</nav>

<br>
<br>


<footer>
    <p>Student Hub Portal</p>
</footer>

    <!-- Contact Us Content -->

   <section class="panel">
        <h2>Frequently Asked Questions</h2>

        <div class="controls">
            <input id="faqs-search" type="search"
                   placeholder="Search questions" aria-label="Search FAQs">

            <select id="faqs-filter" aria-label="Filter by FAQ category">
                <option value="">All Categories</option>
            </select>

            <select id="faqs-sort" aria-label="Sort questions">
                <option value="question-asc">Question: A to Z</option>
                <option value="question-desc">Question: Z to A</option>
            </select>
        </div>

        <p id="faqs-count"></p>
        <p id="faqs-message" class="message" aria-live="polite">
            Loading FAQs...
        </p>
        <div id="faqs-list" class="record-list"></div>
        <div id="faqs-pagination" class="pagination"></div>
    </section>

    <script type="module" src="js/profile.js"></script>
 <script src="script.js"></script>
</body>

</html>
