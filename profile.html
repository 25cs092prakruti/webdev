<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<p>
<a href="studentdashboard.html">Back to Student Dashboard</a>
</p>

<center>
<h1>STUDENT PROFILE</h1>
</center>

</header>

<main>

<section>

<form>

<table width="100%" cellpadding="10">

<tr>

<td width="75%" valign="top">

<fieldset>

<legend><b>PERSONAL DETAILS</b></legend>

<article>

<table cellpadding="8">

<tr>
<td><b>Name</b></td>
<td><textarea rows="1" cols="30"></textarea></td>
<td><b>Age</b></td>
<td><textarea rows="1" cols="8"></textarea></td>
</tr>

<tr>
<td><b>Gender</b></td>
<td>
<input type="radio" name="gender">Male
<input type="radio" name="gender">Female
</td>
<td><b>Department</b></td>
<td><textarea rows="1" cols="20"></textarea></td>
</tr>

<tr>
<td><b>Email</b></td>
<td><textarea rows="1" cols="30"></textarea></td>
<td><b>Enrollment ID</b></td>
<td><textarea rows="1" cols="20"></textarea></td>
</tr>

<tr>
<td><b>Contact No.</b></td>
<td><textarea rows="1" cols="30"></textarea></td>
<td><b>Blood Group</b></td>
<td><textarea rows="1" cols="10"></textarea></td>
</tr>

<tr>
<td><b>Caste</b></td>
<td><textarea rows="1" cols="30"></textarea></td>
<td><b>Nationality</b></td>
<td><textarea rows="1" cols="20"></textarea></td>
</tr>

<tr>
<td><b>Address</b></td>
<td colspan="3">
<textarea rows="3" cols="75"></textarea>
</td>
</tr>

</table>

</article>

</fieldset>

<br>

<fieldset>

<legend><b>EDUCATIONAL DETAILS</b></legend>

<article>

<table border="1" cellpadding="8" width="100%">

<tr>
<th>Class</th>
<th>School Name</th>
<th>Percentage</th>
<th>Rank</th>
</tr>

<tr>
<td>10th</td>
<td><textarea rows="1" cols="20"></textarea></td>
<td><textarea rows="1" cols="10"></textarea></td>
<td><textarea rows="1" cols="10"></textarea></td>
</tr>

<tr>
<td>12th</td>
<td><textarea rows="1" cols="20"></textarea></td>
<td><textarea rows="1" cols="10"></textarea></td>
<td><textarea rows="1" cols="10"></textarea></td>
</tr>

</table>

</article>

</fieldset>

</td>

<td width="25%" valign="top">

<aside>

<fieldset>

<legend><b>STUDENT IMAGE</b></legend>

<br><br>

<input type="file">

</fieldset>

</aside>

</td>

</tr>

</table>

<br>

<center>
<input type="submit" value="Save Profile">
<input type="reset" value="Clear">
</center>

</form>

</section>

</main>

<hr>

<footer>

<center>
<p>Student Hub Portal</p>
</center>

</footer>

</body>

</html>
