<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<p>
<a href="studentdashboard.html">Back to Student Dashboard</a>
</p>
<center>
<h1>STUDENT PROFILE</h1>
</center>
<button id="themeBtn" class="theme-btn">
        🌙 Dark Mode
    </button>
</header>
<main>
<section>
<form>
<table width="100%" cellpadding="10">
<tr>
<td width="70%" valign="top">
<fieldset>
<legend><b>CONTACT INFORMATION</b></legend>
<table cellpadding="8">
<tr>
<td><b>Student Name</b></td>
<td><input type="text" placeholder="Enter your name"></td>
</tr>
<tr>
<td><b>Enrollment ID</b></td>
<td><input type="text" placeholder="Enter Enrollment ID"></td>
</tr>
<tr>
<td><b>Email</b></td>
<td><input type="email" placeholder="Enter Email"></td>
</tr>
<tr>
<td><b>Phone Number</b></td>
<td><input type="tel" placeholder="Enter Phone Number"></td>
</tr>
<tr>
<td><b>Subject</b></td>
<td>
<select>
<option>Select Subject</option>
<option>Technical Issue</option>
<option>Admission</option>
<option>Fees</option>
<option>Course</option>
<option>Other</option>
</select>
</td>
</tr>
<tr>
<td><b>Message</b></td>
<td>
<textarea rows="5" placeholder="Write your message here..."></textarea>
</td>
</tr>
</table>
</fieldset>
</td>
<td width="30%" valign="top">
<fieldset>
<legend><b>COLLEGE CONTACT</b></legend>
<p><b>Student Hub Portal</b></p>
<p>Email:<br>
studenthub@gmail.com</p>
<p>Phone:<br>
+91 9876543210</p>
<p>Address:<br>
ABC College,<br>
Ahmedabad,<br>
Gujarat, India</p>
</fieldset>
</td>
</tr>
</table>
<br>
<center>
<input type="submit" value="Send Message">
<input type="reset" value="Clear">
</center>
</form>
</section>
</main>
<hr>
<footer>
<center>
<p>Student Hub Portal</p>
</center>
</footer>
<script src="script.js"></script>
</body>
</html>
