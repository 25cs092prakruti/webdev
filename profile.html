<!DOCTYPE html>
<html>
<head>
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<p>
<a href="studentdashboard.html">Back to Student Dashboard</a>
</p>
<center>
<h1>STUDENT PROFILE</h1>
</center>
<button id="themeBtn" class="theme-btn">
        🌙 Dark Mode
    </button>
</header>
<main>
<section>
<form id="profileForm" novalidate>
<table width="100%" cellpadding="10">
<tr>
<td width="70%" valign="top">
<fieldset>
<legend><b>CONTACT INFORMATION</b></legend>
<table cellpadding="8">
<tr>
<td><b>Student Name</b></td>
<td><input type="text" id ="name" placeholder="Enter your name" required></td>
<br>
<span id="nameError" class="error"></span>
</tr>

<tr>
<td><b>Enrollment ID</b></td>
<td><input type="text" id="enrollment" placeholder="Enter Enrollment ID"></td>
<br>
<span id="enrollmentError" class="error"></span>
</tr>
<tr>
<td><b>Email</b></td>
<td><input type="email" placeholder="Enter Email"></td>
<br>
<span id="emailError" class="error"></span>
</tr>

<td><label for="age"><b>Age</b></label></td>
<td>
<input type="number" id="age" min="16" max="35" placeholder="Enter your age" required>
<br>
<span id="ageError" class="error"></span>
</td>
</tr>

<tr>
<td><b>Gender</b></td>
<td>

<input type="radio" id="male" name="gender" value="Male">
<label for="male">Male</label>

<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label>

<input type="radio" id="other" name="gender" value="Other">
<label for="other">Other</label>

<br>
<span id="genderError" class="error"></span>

</td>
</tr>

<tr>
<td><label for="photo"><b>Student Photo</b></label></td>
<td>
<input type="file" id="photo" accept="image/*">
<br>
<span id="photoError" class="error"></span>
</td>
</tr>

<tr>
<td><label for="password"><b>Password</b></label></td>
<td>
<input
type="password"
id="password"
placeholder="Enter Password"
required>
<br>
<small id="passwordStrength"></small>
<br>
<span id="passwordError" class="error"></span>
</td>
</tr>
<tr>
<td><label for="confirmPassword"><b>Change Password</b></label></td>
<td>
<input
type="password"
id="confirmPassword"
placeholder="Re-enter Password"
required>
<br>
<span id="confirmPasswordError" class="error"></span>
</td>
</tr>
<td><b>Phone Number</b></td>
<td><input type="tel" id="phone" placeholder="Enter Phone Number"></td>
<br>
<span id="phoneError" class="error"></span>
</tr>
<tr>
<td><b>Subject</b></td>
<td>
<select id="subject">
<option>Select Subject</option>
<option>Technical Issue</option>
<option>Admission</option>
<option>Fees</option>
<option>Course</option>
<option>Other</option>
</select>
<span id="subjectError" class="error"></span>
</td>
</tr>
<tr>
<td><b>Message</b></td>
<td>
<textarea rows="5"id="message" placeholder="Write your message here..."></textarea>
<br>
<span id="messageError" class="error"></span>
</td>
</tr>
</table>
</fieldset>
</td>

</table>
<br>
<center>
<input type="submit" value="Send Message">
<input type="reset" value="Clear">
</center>
</form>
</section>
</main>
<hr>
<footer>
<center>
<p>Student Hub Portal</p>
</center>
</footer>
<script src="script.js"></script>
</body>
</html>
