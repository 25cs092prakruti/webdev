<!DOCTYPE html>
<html>
<head>
    <title>Certificates</title>
<link rel="stylesheet" href="style.css">;
    <style>
        body{
            font-family: Arial, sans-serif;
        }

        .error{
            color:red;
            font-size:14px;
        }
    </style>
</head>

<body>

<header>
    <p>
        <a href="studentdashboard.html">Back to Student Dashboard</a>
    </p>

    <center>
        <h1>CERTIFICATES</h1>
    </center>
    <button id="themeBtn" class="theme-btn">
    🌙 Dark Mode
</button>
</header>

<nav>

<a href="profile.html">Profile</a>

<a href="courses.html">Courses</a>

<a href="result.html">Result</a>

<a href="fees.html">Fees</a>

<a href="certificates.html">Certificates</a>

<a href="leave.html">Leave</a>

<a href="notifications.html">Notifications</a>

<a href="contactus.html">Contact</a>

</nav>

<main>

<section>

<form onsubmit="return validateForm()">

<fieldset>

<legend><b>CERTIFICATE DETAILS</b></legend>

<p>
<label>Certificate Name :</label><br>
<input type="text" id="certificateName" size="45">
</p>

<p>
<label>Category :</label><br>

<input type="radio" name="category" value="Tech"> Tech

<input type="radio" name="category" value="Non-Tech"> Non-Tech

<input type="radio" name="category" value="Workshop"> Workshop

<input type="radio" name="category" value="Seminar"> Seminar

</p>

<p>
<label>Name of Event / Course :</label><br>
<input type="text" id="eventName" size="50">
</p>

<p>
<label>Event Organized By :</label><br>
<input type="text" id="organizer" size="50">
</p>

<p>
<label>Status :</label><br>

<input type="radio" name="status" value="Approved"> Approved

<input type="radio" name="status" value="Rejected"> Rejected

<input type="radio" name="status" value="Pending"> Pending

</p>

<p>
<label>Date of Completion :</label><br>
<input type="date" id="completionDate">
</p>

<p>
<label>Certificate Description :</label><br>
<textarea rows="4" cols="60" id="description"></textarea>
</p>

<p>
<label>Upload Certificate :</label><br>
<input type="file" id="certificateFile">
</p>

</fieldset>

<br>

<center>
<input type="submit" value="Submit">
<input type="reset" value="Clear">
</center>

</form>

</section>

</main>

<hr>

<footer>

<center>

<p>Student Hub Portal</p>

</center>

</footer>
 <script src="script.js"></script>
</body>
</html>
